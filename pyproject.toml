[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpguard"
version = "0.1.0"
description = "Offline synthetic pump monitoring prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1", "pydantic>=2.6,<3", "numpy>=1.26,<3", "openai>=1.68,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
ml = ["scikit-learn>=1.4,<2"]
torch = ["torch>=2.7,<2.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
